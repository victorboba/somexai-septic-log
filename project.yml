name: SepticLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  SepticLog:
    type: application
    platform: iOS
    sources:
      - path: SepticLog
      - path: Shared
    dependencies:
      - target: SepticLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.septic-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SepticLog/SepticLog.entitlements
    info:
      path: SepticLog/Info.plist
      properties:
        CFBundleDisplayName: Septic Tank Service Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  SepticLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SepticLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.septic-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SepticLogWidget/SepticLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: SepticLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Septic Tank Service Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SepticLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SepticLogTests
    dependencies:
      - target: SepticLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.septic-log.tests
        GENERATE_INFOPLIST_FILE: YES
  SepticLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SepticLogUITests
    dependencies:
      - target: SepticLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.septic-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SepticLog
schemes:
  SepticLog:
    build:
      targets:
        SepticLog: all
        SepticLogTests: [test]
        SepticLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SepticLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: SepticLog/StoreKit/Products.storekit
      targets:
        - SepticLogTests
        - SepticLogUITests
    archive:
      config: Release
